# Processed KB artifacts. Raw corpus stays on the dated *.dvc files.
# Run from this directory when Postgres is reachable on 127.0.0.1:15432:
#   dvc repro snapshot-processed
stages:
  snapshot-processed:
    cmd: >-
      PYTHONPATH=../kb-manager python3 -m kb_manager.dvc_snapshot export
      --kb-source .
    deps:
      - ../kb-manager/kb_manager/dvc_snapshot.py
      - ../kb-manager/kb_manager/registry/manifest.py
      - .dvc_pins/current.txt
    outs:
      - processed/1405-06-23:
          persist: true
          cache: true
